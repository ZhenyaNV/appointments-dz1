name: evgenii_nevokshenov
services:
  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: evgenii_nevokshenov
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-study-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d evgenii_nevokshenov"]
      interval: 2s
      timeout: 3s
      retries: 40
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://app:${DB_PASSWORD:-local-study-password}@db:5432/evgenii_nevokshenov
      DB_SCHEMA: evgenii_nevokshenov
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo12345}
    ports:
      - "127.0.0.1:${APP_PORT:-8083}:8083"
    volumes:
      - ./results:/project/results
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]
      interval: 3s
      timeout: 3s
      retries: 40
volumes:
  pgdata:
